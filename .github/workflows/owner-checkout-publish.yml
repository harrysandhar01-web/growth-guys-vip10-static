name: Owner approved automated checkout publication
on:
  workflow_dispatch:
    inputs:
      evidence_package:
        type: string
        required: true
        description: Site-specific successful laptop checkout package; original image and source hashes must validate
      owner_reason:
        type: string
        required: true
        description: Owner's publication instruction for this verified observation
      owner_confirmed:
        type: boolean
        required: true
        default: false
        description: I approve publication of this retained verified evidence
  repository_dispatch:
    types: [owner-checkout-package]
  push:
    branches: [main]
    paths:
      - 'operations/owner-checkout-request.json'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      evidence_package: ${{ steps.request.outputs.evidence_package }}
      owner_reason: ${{ steps.request.outputs.owner_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve authenticated publication request
        id: request
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          CONFIRMED: ${{ inputs.owner_confirmed == true || (github.event_name == 'repository_dispatch' && github.event.client_payload.owner_confirmed == true) }}
          DISPATCH_PACKAGE: ${{ inputs.evidence_package || github.event.client_payload.evidence_package }}
          DISPATCH_REASON: ${{ inputs.owner_reason || github.event.client_payload.owner_reason }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e=process.env;
          if(e.ACTOR!=='harrysandhar01-web'||e.REF!=='refs/heads/main')throw Error('Publication requires authenticated owner on main');
          const req=e.GITHUB_EVENT_NAME==='push'
            ? JSON.parse(fs.readFileSync('operations/owner-checkout-request.json','utf8'))
            : {site:'VIP10',owner_confirmed:e.CONFIRMED==='true',evidence_package:e.DISPATCH_PACKAGE,owner_reason:e.DISPATCH_REASON};
          if(req.site!=='VIP10'||req.owner_confirmed!==true)throw Error('Publication request is not approved for this site');
          if(typeof req.evidence_package!=='string'||!/^public\/evidence\/[a-zA-Z0-9_-]+\/checkout-package\.json$/.test(req.evidence_package))throw Error('Expected site-specific retained checkout package');
          if(typeof req.owner_reason!=='string'||!req.owner_reason.trim()||req.owner_reason.length>700||/[\r\n]/.test(req.owner_reason))throw Error('Expected a single-line owner publication instruction');
          if(!fs.existsSync(req.evidence_package))throw Error('Retained checkout evidence package missing');
          fs.appendFileSync(e.GITHUB_OUTPUT,'evidence_package='+req.evidence_package+'\nowner_reason='+req.owner_reason+'\n');
          NODE
  publish:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source evidence and build owner-approved checkout record
        id: owner
        env:
          SITE_PROFILE: vip10
          EVIDENCE_PACKAGE: ${{ needs.authorize.outputs.evidence_package }}
          OWNER_REASON: ${{ needs.authorize.outputs.owner_reason }}
          OWNER_CONFIRMED: 'true'
        run: |
          set -euo pipefail
          if [[ ! "$EVIDENCE_PACKAGE" =~ ^public/evidence/[a-zA-Z0-9_-]+/checkout-package\.json$ ]]; then
            echo '::error::Expected a retained checkout package inside this site repository'
            exit 1
          fi
          test -s "$EVIDENCE_PACKAGE"
          node --check scripts/validate-checkout-evidence.mjs
          node --check scripts/owner-checkout-publish.mjs
          node scripts/owner-checkout-publish.mjs
      - name: Commit validated current records and projections
        if: steps.owner.outputs.reused != 'true'
        env:
          RECORD: ${{ steps.owner.outputs.record_reference }}
        run: |
          set -euo pipefail
          test -n "$RECORD"
          grep -q "$RECORD" public/api/current-record.json
          grep -q "$RECORD" public/index.html
          git config user.name "Owner-Approved GitHub Publication"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet && exit 1
          git commit -m "Owner approved automated checkout record $RECORD"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Generate optional public history and evidence indexes
        continue-on-error: true
        run: node scripts/build-public-record-indexes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Wait for uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts | map(select(.name == "github-pages" and .expired == false)) | length')
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact metadata visible for this authenticated owner workflow"
              exit 0
            fi
            sleep 8
          done
          echo '::error::Uploaded Pages artifact metadata not visible'
          exit 1
      - name: Publish validated GitHub Pages output
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Confirm optional public history and evidence indexes
        continue-on-error: true
        run: node scripts/confirm-public-record-indexes.mjs
      - name: Confirm canonical routes and slash variants before publication receipt
        env:
          SITE_CODE: VIP10
          SITE_ORIGIN: https://growthguysvip10.ca
        run: node scripts/confirm-live-publication.mjs
      - name: Confirm authoritative live record and homepage
        env:
          RECORD: ${{ steps.owner.outputs.record_reference }}
          DOMAIN: growthguysvip10.ca
          PROFILE: vip10
          EVIDENCE_PACKAGE_INPUT: ${{ needs.authorize.outputs.evidence_package }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for attempt in $(seq 1 20); do
            rm -f /tmp/live-record.json /tmp/live-home.html
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://$DOMAIN/api/current-record.json?check=$GITHUB_RUN_ID-$attempt" -o /tmp/live-record.json || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://$DOMAIN/?check=$GITHUB_RUN_ID-$attempt" -o /tmp/live-home.html || true
            if node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/live-record.json"));const h=fs.readFileSync("/tmp/live-home.html","utf8");if(r.record_reference!==process.env.RECORD||!h.includes(process.env.RECORD)||!h.includes(r.total_cad)||!h.includes(r.product_name))process.exit(1)'; then
              node - <<'NODE'
          const fs = require('fs');
          const record = JSON.parse(fs.readFileSync('/tmp/live-record.json'));
          const receipt = { status:'published_and_live_confirmed', profile:process.env.PROFILE, code:record.code, record_reference:record.record_reference, observed_at:record.observed_at, workflow_run_id:process.env.GITHUB_RUN_ID, actor:process.env.GITHUB_ACTOR, evidence_package:process.env.EVIDENCE_PACKAGE_INPUT, live_record:record, confirmed_at:new Date().toISOString() };
          fs.writeFileSync('artifacts/checkout-publication-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE
              exit 0
            fi
            sleep 8
          done
          echo '::error::Live current record not yet confirmed'
          exit 1
      - name: Save authoritative publication receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-publication-receipt
          path: artifacts/checkout-publication-receipt.json
          if-no-files-found: error
          retention-days: 30
