name: Test owner manual publishing without touching production
on:
  push:
    paths:
      - 'scripts/owner-manual-publish.mjs'
      - 'scripts/owner-checkout-publish.mjs'
      - 'scripts/validate-checkout-evidence.mjs'
      - 'scripts/test-checkout-publication-recovery.mjs'
      - '.github/workflows/owner-checkout-publish.yml'
      - 'scripts/validate-current-record-projection.mjs'
      - '.github/workflows/owner-manual-publish.yml'
      - '.github/workflows/owner-publish-preflight.yml'
  pull_request:
    paths:
      - 'scripts/owner-manual-publish.mjs'
      - 'scripts/owner-checkout-publish.mjs'
      - 'scripts/validate-checkout-evidence.mjs'
      - 'scripts/test-checkout-publication-recovery.mjs'
      - '.github/workflows/owner-checkout-publish.yml'
      - 'scripts/validate-current-record-projection.mjs'
      - '.github/workflows/owner-manual-publish.yml'
      - '.github/workflows/owner-publish-preflight.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test local checkout evidence and safe existing-record recovery
        run: |
          node --check scripts/owner-checkout-publish.mjs
          node scripts/test-checkout-publication-recovery.mjs
      - name: Syntax-check manual publisher
        run: node --check scripts/owner-manual-publish.mjs
      - name: Exercise historical cart evidence in two isolated snapshots
        env:
          GITHUB_ACTOR: harrysandhar01-web
          OWNER_CONFIRMED: 'true'
          SITE_PROFILE: vip10
          OBSERVATION_SCOPE: cart-only
          OBSERVED_EASTERN: '2026-11-23 00:20'
          PRODUCT_NAME: 'Semaglutide 5mg - Single vial'
          CART_SUBTOTAL: '50.00'
          DISCOUNT_AMOUNT: '5.00'
          DISPLAYED_TOTAL: '36.00'
          BITCOIN_ADJUSTMENT: '9.00'
          TIMESTAMP_PRECISION: 'minute-rounded; exact milliseconds retained in the provenance bundle'
          TIMESTAMP_UNCERTAINTY: 'Timestamp is supplied in provenance; not visibly embedded in screenshot.'
          EVIDENCE_URL: '/evidence/2026-11-23-vip10-cart-only/vip10-cart-final-original.webp'
          OWNER_REASON: 'Isolated regression test using historical original evidence; no production changes'
        run: |
          set -euo pipefail
          for mode in correction new; do
            work="$RUNNER_TEMP/owner-test-$mode"
            mkdir -p "$work"
            cp -a public "$work/public"
            (
              cd "$work"
              if [ "$mode" = correction ]; then
                cp public/owner-records/vip10-owner-20261123052000-45119874256/record.json public/api/current-record.json
              else
                cp public/evidence/2026-11-23-vip10-cart-only/live-current-record-readback.json public/api/current-record.json
              fi
              PUBLICATION_MODE="$mode" node "$GITHUB_WORKSPACE/scripts/owner-manual-publish.mjs"
              python3 "$GITHUB_WORKSPACE/scripts/project-existing-current-record.py" --public-dir public
              node "$GITHUB_WORKSPACE/scripts/validate-current-record-projection.mjs" public
              node "$GITHUB_WORKSPACE/scripts/validate-current-facing-projection.mjs" public
              node "$GITHUB_WORKSPACE/scripts/validate-canonical-snapshot.mjs" public
              test -s public/owner-publication-state.json
            )
          done
          git diff --exit-code -- public
          echo 'Owner publication dry-runs used isolated historical snapshots; production unchanged.'
      - name: Reject a stale new observation against the actual current record
        env:
          GITHUB_ACTOR: harrysandhar01-web
          OWNER_CONFIRMED: 'true'
          SITE_PROFILE: vip10
          PUBLICATION_MODE: new
          OBSERVATION_SCOPE: cart-only
          OBSERVED_EASTERN: '2026-11-23 00:20'
          OWNER_REASON: 'Regression test: stale observation must not replace the current record'
        run: |
          set -euo pipefail
          if node scripts/owner-manual-publish.mjs > "$RUNNER_TEMP/stale.log" 2>&1; then
            echo '::error::Stale observation was accepted'
            exit 1
          fi
          grep -q 'new_record_cannot_precede_existing_record' "$RUNNER_TEMP/stale.log"
          git diff --exit-code -- public
