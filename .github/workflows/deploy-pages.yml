name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate current accepted record and canonical routes locally
        run: |
          node scripts/validate-canonical-snapshot.mjs public
          node scripts/validate-current-record-projection.mjs public
      - name: Generate optional public history and evidence indexes
        continue-on-error: true
        run: node scripts/build-public-record-indexes.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Wait for uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts | map(select(.name == "github-pages" and .expired == false)) | length')
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact metadata visible"
              exit 0
            fi
            sleep 8
          done
          echo '::error::Uploaded Pages artifact metadata not visible'
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm optional public history and evidence indexes
        continue-on-error: true
        run: node scripts/confirm-public-record-indexes.mjs
      - name: Independently confirm deployed current record and public surfaces
        env:
          SITE_CODE: VIP10
          SITE_ORIGIN: https://growthguysvip10.ca
        run: |
          node scripts/confirm-live-publication.mjs
